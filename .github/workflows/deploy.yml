name: "Deploy LPlot Website"

on:
    push:
        branches:
            - main

jobs:
    deploy:
        name: "Build Svelte and Restart Express"
        runs-on: self-hosted
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
       
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 'lts/*'
                cache: 'npm'

            - name: "Stop PM2"
              run: "pm2 stop \"LPlot-Website\""

            - name: "Update Packages"
              run: npm install
            
            - name: "Build Svelte"
              run: npm run build

            - name: "Run Project"
              run: node build

            - name: "Start PM2"
              run: "pm2 start \"LPlot-Website\""

            - name: "Save PM2"
              run: pm2 save